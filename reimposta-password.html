<!DOCTYPE html>
<!-- FILE VERSION: 2026-06-04.2 · reimposta-password.html -->
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reimposta password · Il Mio Apiario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="js/auth.js?v=20260604e"></script>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:'Spline Sans',system-ui,sans-serif; color:#3A2E1A; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
    background:
      radial-gradient(circle at 18% 12%, rgba(232,163,23,.10), transparent 42%),
      radial-gradient(circle at 86% 88%, rgba(200,132,26,.10), transparent 46%),
      linear-gradient(160deg, #FBF4E6 0%, #F5E9D0 100%);
  }
  .card{
    background:#FFFDF8; border:1px solid #E6D6B3; border-radius:24px;
    box-shadow:0 10px 40px -12px rgba(139,94,20,.28);
    padding:38px 30px 30px; max-width:440px; width:100%; position:relative; overflow:hidden;
  }
  .card::after{ content:""; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,#E8A317,#8B5E14); }
  .brand{ text-align:center; margin-bottom:24px; }
  .logo{
    width:58px; height:58px; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:30px;
    background:radial-gradient(circle at 35% 30%,#FFD466,#E8A317 70%); border-radius:17px;
    box-shadow:0 4px 16px -6px rgba(139,94,20,.22), inset 0 -3px 8px rgba(139,94,20,.25); transform:rotate(-4deg);
  }
  .brand h1{ font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:22px; color:#8B5E14; }
  .titolo{ font-family:'Fraunces',Georgia,serif; font-size:19px; font-weight:600; margin-bottom:6px; }
  .sub{ color:#7A6A4F; font-size:14px; margin-bottom:20px; line-height:1.5; }
  .field{ margin-bottom:15px; }
  .field label{ display:block; font-size:13px; font-weight:500; margin-bottom:6px; }
  .inwrap{ position:relative; }
  .field input{
    width:100%; padding:12px 14px; border:1.5px solid #E6D6B3; border-radius:12px;
    font-size:15px; font-family:inherit; background:#FFFEFB; color:#3A2E1A; transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus{ outline:none; border-color:#E8A317; box-shadow:0 0 0 3px rgba(232,163,23,.16); }
  .eye{ position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:16px; padding:4px; color:#7A6A4F; }
  .fieldmsg{ font-size:12px; color:#B5562E; margin-top:5px; display:none; }
  .btn{
    width:100%; padding:13px; border:none; border-radius:12px; font-size:15px; font-weight:600;
    font-family:inherit; cursor:pointer; color:#fff; text-decoration:none; display:inline-block; text-align:center;
    background:linear-gradient(135deg,#E8A317,#C8841A); box-shadow:0 4px 16px -6px rgba(139,94,20,.22);
  }
  .btn:hover:not(:disabled){ filter:brightness(1.04); }
  .btn:disabled{ opacity:.6; cursor:default; }
  .err{ background:#FBEBE4; border:1px solid #E6BBA6; color:#B5562E; font-size:13px; border-radius:10px; padding:9px 12px; margin-bottom:14px; display:none; }
  .center{ text-align:center; }
  .ico{ font-size:44px; margin:6px 0; text-align:center; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><div class="logo">🐝</div><h1>Il Mio Apiario</h1></div>
    <div id="contenuto">
      <div class="titolo">Imposta una nuova password</div>
      <div class="sub">Scegli una nuova password per il tuo account.</div>
      <div class="err" id="err"></div>
      <div class="field">
        <label for="pwd1">Nuova password</label>
        <div class="inwrap">
          <input type="password" id="pwd1" autocomplete="new-password" placeholder="Almeno 8 caratteri">
          <button type="button" class="eye" data-target="pwd1">👁</button>
        </div>
        <div class="fieldmsg" id="pwd1msg"></div>
      </div>
      <div class="field">
        <label for="pwd2">Conferma password</label>
        <div class="inwrap">
          <input type="password" id="pwd2" autocomplete="new-password" placeholder="Ripeti la password">
          <button type="button" class="eye" data-target="pwd2">👁</button>
        </div>
        <div class="fieldmsg" id="pwd2msg"></div>
      </div>
      <button class="btn" id="btnReset">Aggiorna password</button>
    </div>
  </div>

<script>
  (function () {
    'use strict';
    function el(id){ return document.getElementById(id); }
    function vista(html){ const c = el('contenuto'); if(c) c.innerHTML = html; }
    function showErr(msg){ const e = el('err'); if(e){ e.textContent = msg; e.style.display = 'block'; } }
    function hideErr(){ const e = el('err'); if(e) e.style.display = 'none'; }
    function showMsg(id,msg){ const e = el(id); if(e){ e.textContent = msg; e.style.display = 'block'; } }
    function hideMsg(id){ const e = el(id); if(e) e.style.display = 'none'; }

    function leggiToken(){
      try { return new URLSearchParams(window.location.search).get('token'); }
      catch (e) { return null; }
    }

    // mostra/nascondi password
    function bindEye(){
      document.querySelectorAll('.eye').forEach(function(b){
        b.addEventListener('click', function(){
          const t = el(b.getAttribute('data-target'));
          if(!t) return;
          t.type = t.type === 'password' ? 'text' : 'password';
          b.textContent = t.type === 'password' ? '👁' : '🙈';
        });
      });
    }

    function tokenMancante(){
      vista(`
        <div class="ico">⚠️</div>
        <div class="titolo center">Link non valido</div>
        <div class="sub center">Questo link per reimpostare la password non è valido o è incompleto. Richiedine uno nuovo dall'app.</div>
        <a class="btn" href="index.html">Vai all'app</a>
      `);
    }

    function successo(){
      vista(`
        <div class="ico">✅</div>
        <div class="titolo center">Password aggiornata!</div>
        <div class="sub center">La tua password è stata reimpostata. Ora puoi accedere con le nuove credenziali.</div>
        <a class="btn" href="index.html">Vai al login</a>
      `);
    }

    async function eseguiReset(){
      const token = leggiToken();
      const p1 = el('pwd1') ? el('pwd1').value : '';
      const p2 = el('pwd2') ? el('pwd2').value : '';
      hideErr(); hideMsg('pwd1msg'); hideMsg('pwd2msg');

      let valido = true;
      if(!p1 || p1.length < 8){ showMsg('pwd1msg','La password deve avere almeno 8 caratteri.'); valido = false; }
      if(p2 !== p1){ showMsg('pwd2msg','Le due password non coincidono.'); valido = false; }
      if(!valido) return;

      if(typeof Auth === 'undefined' || !Auth.resetPassword){
        showErr('Si è verificato un problema tecnico. Riprova più tardi.'); return;
      }

      const btn = el('btnReset');
      if(btn){ btn.disabled = true; btn.textContent = '⏳ Aggiornamento...'; }
      try {
        await Auth.resetPassword({ token: token, newPassword: p1 });
        successo();
      } catch (e) {
        console.error('[Reset password] Errore:', e.message);
        showErr(Auth.messaggioErrore ? Auth.messaggioErrore(e) : 'Il link è scaduto o non valido.');
        if(btn){ btn.disabled = false; btn.textContent = 'Aggiorna password'; }
      }
    }

    window.addEventListener('load', function(){
      if(!leggiToken()){ tokenMancante(); return; }
      bindEye();
      const btn = el('btnReset');
      if(btn) btn.addEventListener('click', eseguiReset);
      ['pwd1','pwd2'].forEach(function(id){
        const e = el(id);
        if(e) e.addEventListener('keydown', function(ev){ if(ev.key === 'Enter'){ ev.preventDefault(); eseguiReset(); } });
      });
    });
  })();
</script>
</body>
</html>
