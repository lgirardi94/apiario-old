# ============================================================
# nginx.conf — Frontend "Il Mio Apiario"
# ============================================================
# - Serve i file statici dell'app (index.html, le PWA, js/, icons/, css)
# - Inoltra le chiamate /api/ al backend Node (reverse proxy)
#
# Così frontend e backend stanno sullo stesso dominio: NIENTE CORS,
# e in js/auth.js puoi impostare BASE_URL = '' (stringa vuota),
# perché le chiamate /api/... restano sullo stesso host.
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressione (pagine e asset più leggeri)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ----- File statici dell'app -----
    # Prova il file richiesto; se non esiste, risponde 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # ----- Proxy verso il backend per le chiamate API -----
    # ⚠️ CONFIGURA con la chat backend:
    #    - "backend" = nome del servizio backend nel docker-compose
    #    - 3000      = porta su cui il backend Node ascolta
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # timeouts ragionevoli
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ----- Cache per gli asset statici (prestazioni) -----
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # I file .json (manifest PWA, dati) NON devono essere cache-ati a lungo
    location ~* \.json$ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
